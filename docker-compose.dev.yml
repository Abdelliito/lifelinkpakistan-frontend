# Docker Compose for Development

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: lifelink-dev-db
    environment:
      POSTGRES_DB: lifelink_dev
      POSTGRES_USER: lifelink_user
      POSTGRES_PASSWORD: dev-password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifelink_user -d lifelink_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lifelink-dev

volumes:
  postgres_dev_data:

networks:
  lifelink-dev:
